[package]
name = "magelang"
version = "0.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bumpalo = "3.14.0"
magelang_syntax = { path = "../magelang_syntax" }
magelang_typecheck = { path = "../magelang_typecheck" }
magelang_wasmgen = { path = "../magelang_wasmgen" }
magelang_cranelift = { path = "../magelang_cranelift" }
magelang_llvm = { path = "../magelang_llvm" }
anyhow = "1"
tempfile = "3"
wasm_helper = { path = "../wasm_helper" }
clap = { version = "4.0", features = ["derive"] }
wasmtime = "48.0.1"
wasmtime-wasi = "48.0.1"
binaryen = "0.13.0"
